name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [lowest, highest]
        experimental: [false]
        include:
          # Not released yet: failures are reported, but never fail the build
          - php: '8.6'
            dependencies: lowest
            experimental: true
          - php: '8.6'
            dependencies: highest
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: memory_limit=-1
          tools: composer:v2

      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependencies }}-

      - name: Install dependencies
        run: >-
          composer update --no-interaction --no-progress
          ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
          ${{ matrix.experimental && '--ignore-platform-req=php+' || '' }}

      - name: Run tests
        run: vendor/bin/phpunit
